## 智能需求挖掘 - 种子词配置 (v2: AI 纵深扩展)
##
## 优先级一: 「人们已在用 AI, 但用法粗糙」可被技术包装的场景
##   → 13 个 category, 覆盖 AI 娱乐/创作/学习/工作/生活/工具教程 6 个维度
## 优先级二(暂未开启): 非 AI 场景
##
## 流水线: scene_words × trade_signals 笛卡尔积生成搜索词
## 估算: 13 × 平均6 × 4 = 312 任务, 配合 -max-per-keyword 控制规模

categories:
  # ============== AI 娱乐 (用 AI 玩) ==============
  - name: ai-entertainment-roleplay
    scene_words:
      - AI 剧本
      - 文游模拟器
      - AI 陪聊
      - AI 男友
      - AI 女友
      - 角色扮演 AI
      - 高中生模拟器
      - AI 文字游戏

  - name: ai-entertainment-occult
    scene_words:
      - AI 占卜
      - AI 塔罗
      - AI 算命
      - AI 解梦
      - AI 八字

  - name: ai-entertainment-creative
    scene_words:
      - AI 写小说
      - AI 续写
      - AI 同人
      - AI 整活
      - AI 写诗

  # ============== AI 创作内容 ==============
