      - AI 表情包
      - AI 海报
      - AI 插画
      - midjourney 教程
      - 即梦 AI
      - 可灵 AI

  # ============== AI 学习辅导 ==============
  - name: ai-study-language
    scene_words:
      - AI 学英语
      - AI 翻译
      - AI 背单词
      - AI 练口语
      - AI 学日语

  - name: ai-study-academic
    scene_words:
      - AI 写论文
      - AI 论文降重
      - AI 解题
      - AI 整理笔记
      - AI 学数学

  # ============== AI 工作效率 ==============
  - name: ai-work-job
    scene_words:
      - AI 写简历
      - AI 面试
      - AI 求职信
      - AI 自我介绍

  - name: ai-work-office
    scene_words:
      - AI 做 PPT
      - AI 写报告
      - AI 做 excel
      - AI 自媒体变现

  # ============== AI 生活实用 ==============
