      - AI 取英文名
      - AI 旅游攻略
      - AI 穿搭推荐

  # ============== AI 工具/教程 ==============
  - name: ai-tools-prompt
    scene_words:
      - DeepSeek 指令
      - prompt 合集
      - 提示词模板
      - ChatGPT 指令
      - 豆包指令

  - name: ai-tools-agent
    scene_words:
      - coze 智能体
      - dify
      - 智能体搭建
      - AI 工作流
      - AI 自动化

# 交易信号词: 与 scene_words 笛卡尔积
# 收窄到 4 个高信号词, 控制总搜索量
trade_signals:
  - 教程
  - 合集
  - 9.9
  - 私
